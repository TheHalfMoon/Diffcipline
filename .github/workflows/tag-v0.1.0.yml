name: tag-v0.1.0

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  actions: read
  pull-requests: read

jobs:
  tag:
    name: create verified v0.1.0 tag
    if: >-
      github.event.issue.pull_request &&
      github.event.comment.user.login == github.repository_owner &&
      startsWith(github.event.comment.body, '/release v0.1.0 ')
    runs-on: ubuntu-latest
    steps:
      - name: Parse explicit release request
        id: request
        shell: bash
        env:
          REQUEST_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          read -r command tag target_sha extra <<< "$REQUEST_BODY"
          test "$command" = "/release"
          test "$tag" = "v0.1.0"
          test -z "${extra:-}"
          [[ "$target_sha" =~ ^[0-9a-f]{40}$ ]]
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "target_sha=$target_sha" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.request.outputs.target_sha }}
          fetch-depth: 0

      - name: Verify exact canonical release commit
        shell: bash
        env:
          TAG: ${{ steps.request.outputs.tag }}
          TARGET_SHA: ${{ steps.request.outputs.target_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git fetch origin main --no-tags
          test "$(git rev-parse origin/main)" = "$TARGET_SHA"
          crate_version="$(awk -F '"' '/^version = / {print $2; exit}' crates/diffcipline-cli/Cargo.toml)"
          test "$crate_version" = "0.1.0"
          test "$TAG" = "v${crate_version}"
          if git ls-remote --exit-code origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Refusing to replace existing tag $TAG" >&2
            exit 1
          fi

      - name: Verify exact-SHA post-merge T062 workflows
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.request.outputs.target_sha }}
        run: |
          set -euo pipefail
          verify_workflow() {
            workflow="$1"
            run_id="$(
              gh api -X GET \
                "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs" \
                -f head_sha="$TARGET_SHA" \
                -f event=push \
                -f status=completed \
                -f per_page=100 \
                --jq '.workflow_runs | map(select(.head_sha == env.TARGET_SHA and .event == "push" and .conclusion == "success")) | .[0].id // empty'
            )"
            test -n "$run_id"
            echo "$workflow exact-SHA successful run: $run_id"
          }
          verify_workflow ci.yml
          verify_workflow skills-compat.yml
          verify_workflow release.yml

      - name: Create lightweight tag at verified canonical SHA
        shell: bash
        env:
          TAG: ${{ steps.request.outputs.tag }}
          TARGET_SHA: ${{ steps.request.outputs.target_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git tag "$TAG" "$TARGET_SHA"
          test "$(git rev-parse "refs/tags/$TAG")" = "$TARGET_SHA"
          git push origin "refs/tags/$TAG"
