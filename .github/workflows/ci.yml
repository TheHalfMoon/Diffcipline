name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --all-targets --locked
      - name: Validate proof-v1 schema contract
        if: runner.os == 'Linux'
        run: python3 scripts/validate-proof-v1.py

  dogfood:
    name: Diffcipline proof gate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Dogfood default Action proof
        id: default-proof
        continue-on-error: true
        uses: ./
        with:
          base: ${{ github.event.pull_request.base.sha || github.event.before }}
          run-verification: "true"
      - name: Verify default proof outcome
        shell: bash
        env:
          ACTION_OUTCOME: ${{ steps.default-proof.outcome }}
          DIFFCIPLINE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          proof_file="$RUNNER_TEMP/diffcipline-default-proof.json"
          set +e
          cargo run --quiet --locked --package diffcipline -- \
            check --base "$DIFFCIPLINE_BASE" --run --json > "$proof_file"
          status=$?
          set -e
          cat "$proof_file"

          verdict="$(python3 - "$proof_file" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as handle:
              proof = json.load(handle)
          print(proof["verdict"])
          PY
          )"

          if [[ "$status" -eq 0 && "$verdict" == "PASS" ]]; then
            test "$ACTION_OUTCOME" = "success"
            exit 0
          fi

          test "$status" -eq 1
          test "$verdict" = "REVIEW"
          test "$ACTION_OUTCOME" = "failure"

          python3 - "$proof_file" "$DIFFCIPLINE_BASE" <<'PY'
          import json
          import pathlib
          import re
          import subprocess
          import sys

          proof_path, base = sys.argv[1:]
          with open(proof_path, encoding="utf-8") as handle:
              proof = json.load(handle)

          assert proof["verdict"] == "REVIEW"
          assert not proof["scope_violations"]
          assert proof["verification"]
          assert all(item["state"] == "PASS" for item in proof["verification"])

          manifest = "crates/diffcipline-cli/Cargo.toml"
          lockfile = "Cargo.lock"

          def show(ref: str, path: str) -> str:
              return subprocess.check_output(["git", "show", f"{ref}:{path}"], text=True)

          def current(path: str) -> str:
              return pathlib.Path(path).read_text(encoding="utf-8")

          def manifest_version(text: str) -> str:
              match = re.search(r'^version = "([^"]+)"$', text, re.MULTILINE)
              assert match
              return match.group(1)

          def normalize_manifest(text: str) -> str:
              normalized, count = re.subn(
                  r'^version = "[^"]+"$',
                  'version = "<VERSION>"',
                  text,
                  count=1,
                  flags=re.MULTILINE,
              )
              assert count == 1
              return normalized

          lock_pattern = re.compile(
              r'(\[\[package\]\]\nname = "diffcipline"\nversion = ")[^"]+("\n)'
          )

          def lock_version(text: str) -> str:
              match = lock_pattern.search(text)
              assert match
              return text[match.start(1) + len(match.group(1)):match.end(2) - 2]

          def normalize_lock(text: str) -> str:
              normalized, count = lock_pattern.subn(
                  r'\g<1><VERSION>\g<2>', text, count=1
              )
              assert count == 1
              return normalized

          base_manifest = show(base, manifest)
          head_manifest = current(manifest)
          base_lock = show(base, lockfile)
          head_lock = current(lockfile)

          assert manifest_version(base_manifest) == "0.1.0"
          assert manifest_version(head_manifest) == "1.0.0"
          assert normalize_manifest(base_manifest) == normalize_manifest(head_manifest)
          assert lock_version(base_lock) == "0.1.0"
          assert lock_version(head_lock) == "1.0.0"
          assert normalize_lock(base_lock) == normalize_lock(head_lock)
          PY
      - name: Prepare risk-annotation fixture
        shell: bash
        run: |
          set -euo pipefail
          fixture="../diffcipline-action-fixture"
          rm -rf "$fixture"
          mkdir -p "$fixture"
          git -C "$fixture" init --quiet
          git -C "$fixture" config user.name "Diffcipline CI"
          git -C "$fixture" config user.email "diffcipline-ci@example.invalid"
          printf 'before\n' > "$fixture/tracked.txt"
          cat > "$fixture/.diffcipline.toml" <<'EOF'
          version = 1

          [policy]
          max_changed_files = 4
          max_added_lines = 20
          dependency_manifest_changes = "allow"
          lockfile_changes = "allow"
          untracked_files = "allow"
          expected_files = ["tracked.txt"]
          forbidden_surfaces = ["secrets/**"]

          [verification]
          commands = ["git diff --check"]
          r0_commands = ["git diff --check"]
          EOF
          git -C "$fixture" add tracked.txt .diffcipline.toml
          git -C "$fixture" commit --quiet -m "fixture base"
          printf 'after\n' > "$fixture/tracked.txt"
      - name: Dogfood risk Action annotation
        uses: ./
        with:
          working-directory: ../diffcipline-action-fixture
          risk: R0
          run-verification: "true"
      - name: Reject invalid Action risk
        id: invalid-risk
        continue-on-error: true
        uses: ./
        with:
          risk: R4
      - name: Verify invalid Action risk rejection
        shell: bash
        env:
          INVALID_RISK_OUTCOME: ${{ steps.invalid-risk.outcome }}
        run: test "$INVALID_RISK_OUTCOME" = "failure"
