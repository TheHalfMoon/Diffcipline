name: local-tool-allowlist-probe

on:
  pull_request:
    paths:
      - ".github/workflows/local-tool-allowlist-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch pinned runtime and model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/local"/{copilot,llama}
          curl -fsSL "https://github.com/github/copilot-cli/releases/download/v1.0.81/copilot-linux-x64.tar.gz" -o "$RUNNER_TEMP/local/copilot.tgz"
          echo "3082c4a27aa683def52e48397c02606dc7f8267dcef1c93949f3f58de4a5cde3  $RUNNER_TEMP/local/copilot.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/local/copilot.tgz" -C "$RUNNER_TEMP/local/copilot"
          curl -fsSL "https://github.com/ggml-org/llama.cpp/releases/download/b10621/llama-b10621-bin-ubuntu-x64.tar.gz" -o "$RUNNER_TEMP/local/llama.tgz"
          echo "91d7b03ddae498a39f28fdb85d84d2b4a0fd3838d10b4f897e0ef8975bb9b583  $RUNNER_TEMP/local/llama.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/local/llama.tgz" -C "$RUNNER_TEMP/local/llama"
          curl -fsSL "https://huggingface.co/Qwen/Qwen2.5-Coder-7B-Instruct-GGUF/resolve/13fb94bfda8c8cf22497dc57b78f391a9acb426a/qwen2.5-coder-7b-instruct-q4_k_m.gguf?download=true" -o "$RUNNER_TEMP/local/model.gguf"
          echo "509287f78cb4d4cf6b3843734733b914b2c158e43e22a7f4bf5e963800894d3c  $RUNNER_TEMP/local/model.gguf" | sha256sum -c -
          curl -fsSL "https://raw.githubusercontent.com/ggml-org/llama.cpp/c1d0e7a004015f23bc0233470b747b596f29b264/models/templates/Qwen-Qwen2.5-7B-Instruct.jinja" -o "$RUNNER_TEMP/local/tool-template.jinja"
          test "$(git hash-object "$RUNNER_TEMP/local/tool-template.jinja")" = "bdf7919a96cfe43d50914a007b9c0877bd0ec27e"
      - name: Start pinned tool-aware server
        shell: bash
        run: |
          set -euo pipefail
          server="$(find "$RUNNER_TEMP/local/llama" -type f -name llama-server -print -quit)"
          chmod +x "$server"
          "$server" --model "$RUNNER_TEMP/local/model.gguf" --host 127.0.0.1 --port 8080 \
            --alias diffcipline-qwen2.5-coder-7b-q4km --ctx-size 32768 --threads 4 --parallel 1 \
            --jinja --chat-template-file "$RUNNER_TEMP/local/tool-template.jinja" \
            > "$RUNNER_TEMP/local/server.log" 2>&1 &
          for _ in $(seq 1 240); do
            curl -fsS http://127.0.0.1:8080/health > "$RUNNER_TEMP/local/health.json" && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/local/server.log"
          exit 1
      - name: Prove minimal bash tool interface
        shell: bash
        run: |
          set -euo pipefail
          copilot="$(find "$RUNNER_TEMP/local/copilot" -type f -name copilot -print -quit)"
          chmod +x "$copilot"
          mkdir -p "$RUNNER_TEMP/probe-work" "$RUNNER_TEMP/probe-home"
          nonce="$(python -c 'import secrets; print(secrets.token_hex(16))')"
          printf '%s\n' "$nonce" > "$RUNNER_TEMP/probe-work/preflight-nonce.txt"
          (
            cd "$RUNNER_TEMP/probe-work"
            COPILOT_HOME="$RUNNER_TEMP/probe-home" \
            COPILOT_PROVIDER_TYPE=openai \
            COPILOT_PROVIDER_BASE_URL=http://127.0.0.1:8080/v1 \
            COPILOT_MODEL=diffcipline-qwen2.5-coder-7b-q4km \
            COPILOT_OFFLINE=true \
            timeout 480s "$copilot" -p "Use bash to read preflight-nonce.txt, then reply with the exact file contents." \
              --model diffcipline-qwen2.5-coder-7b-q4km --no-ask-user \
              --available-tools=bash --allow-tool=shell --disable-builtin-mcps \
              --share "$RUNNER_TEMP/local/probe.md" \
              > "$RUNNER_TEMP/local/probe.stdout" 2> "$RUNNER_TEMP/local/probe.stderr"
          )
          grep -Fq "$nonce" "$RUNNER_TEMP/local/probe.stdout" || grep -Fq "$nonce" "$RUNNER_TEMP/local/probe.md"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: local-tool-allowlist-probe
          path: |
            ${{ runner.temp }}/local/probe.md
            ${{ runner.temp }}/local/probe.stdout
            ${{ runner.temp }}/local/probe.stderr
            ${{ runner.temp }}/local/server.log
            ${{ runner.temp }}/local/health.json
          if-no-files-found: warn
          retention-days: 7
