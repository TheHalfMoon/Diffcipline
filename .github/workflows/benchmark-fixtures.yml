name: benchmark-fixtures

on:
  pull_request:
    paths:
      - "benchmarks/fixtures/**"
      - "benchmarks/harness/**"
      - "benchmarks/README.md"
      - ".github/workflows/benchmark-fixtures.yml"
  push:
    branches: [main]
    paths:
      - "benchmarks/fixtures/**"
      - "benchmarks/harness/**"
      - "benchmarks/README.md"
      - ".github/workflows/benchmark-fixtures.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Validate frozen fixture initial states
        run: python benchmarks/harness/validate_fixtures.py
      - name: Prove deterministic fixture revisions
        shell: bash
        run: |
          set -euo pipefail
          for fixture in benchmarks/fixtures/*; do
            name="$(basename "$fixture")"
            first="$(python benchmarks/harness/prepare_fixture.py "$fixture" "$RUNNER_TEMP/${name}-a")"
            second="$(python benchmarks/harness/prepare_fixture.py "$fixture" "$RUNNER_TEMP/${name}-b")"
            test "$first" = "$second"
          done
      - name: Smoke-test no-change scorer contract
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/f06"
          base="$(python benchmarks/harness/prepare_fixture.py benchmarks/fixtures/f06-already-minimal "$work")"
          python benchmarks/harness/score_run.py \
            --fixture benchmarks/fixtures/f06-already-minimal \
            --work "$work" \
            --base "$base" \
            --arm harness-smoke \
            --model none \
            --agent-exit-code 0 \
            --output "$RUNNER_TEMP/f06-score.json"
          python - "$RUNNER_TEMP/f06-score.json" <<'PY'
          import json
          import sys
          result = json.load(open(sys.argv[1], encoding="utf-8"))
          assert result["pass"] is True
          assert result["correctness"] is True
          assert result["changed_files"] == 0
          assert result["added_lines"] == 0
          assert result["deleted_lines"] == 0
          PY
