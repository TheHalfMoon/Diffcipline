name: benchmark-arms

on:
  pull_request:
    paths:
      - ".github/workflows/benchmark-arms.yml"
      - "benchmarks/run-config.json"
      - "benchmarks/harness/run_arm.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/benchmark-arms.yml"
      - "benchmarks/run-config.json"
      - "benchmarks/harness/run_arm.py"

permissions:
  contents: read

env:
  FIXTURE_REVISION: 4f796058bddd840be31d3fbf7d74b34a5403c49c

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Verify frozen corpus and local run configuration
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code "$FIXTURE_REVISION" -- \
            benchmarks/fixtures \
            benchmarks/harness/prepare_fixture.py \
            benchmarks/harness/score_run.py
          python benchmarks/harness/validate_fixtures.py
          python - <<'PY'
          import json, os
          config = json.load(open("benchmarks/run-config.json", encoding="utf-8"))
          assert config["fixture_revision"] == os.environ["FIXTURE_REVISION"]
          assert config["model"]["id"] == "diffcipline-qwen2.5-coder-1.5b-q4km"
          assert config["model"]["license"] == "Apache-2.0"
          assert len(config["model"]["sha256"]) == 64
          assert config["provider"]["type"] == "openai"
          assert config["provider"]["base_url"] == "http://127.0.0.1:8080/v1"
          assert config["provider"]["runtime"] == "llama.cpp"
          assert len(config["provider"]["sha256"]) == 64
          assert config["provider"]["chat_template"]["revision"] == config["provider"]["source_revision"]
          assert config["provider"]["chat_template"]["blob_sha"] == "bdf7919a96cfe43d50914a007b9c0877bd0ec27e"
          assert config["resource_limits"]["runner"] == "ubuntu-latest"
          assert config["resource_limits"]["network_tools"] == "denied"
          assert config["resource_limits"]["git_push"] == "denied"
          assert config["copilot_cli"]["version"] == "v1.0.81"
          assert len(config["copilot_cli"]["linux_x64_sha256"]) == 64
          PY
      - name: Build pinned local runtime inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/runtime"/{copilot,provider,treatments/{karpathy-guidelines,ponytail,diffcipline}}
          python - <<'PY' > "$RUNNER_TEMP/runtime/env"
          import json, shlex
          c = json.load(open("benchmarks/run-config.json", encoding="utf-8"))
          values = {
              "COPILOT_URL": c["copilot_cli"]["download_url"],
              "COPILOT_SHA": c["copilot_cli"]["linux_x64_sha256"],
              "PROVIDER_URL": c["provider"]["download_url"],
              "PROVIDER_SHA": c["provider"]["sha256"],
              "MODEL_URL": c["model"]["download_url"],
              "MODEL_SHA": c["model"]["sha256"],
              "MODEL_SIZE": str(c["model"]["size_bytes"]),
              "MODEL_FILE": c["model"]["file"],
          }
          for key, value in values.items():
              print(f"{key}={shlex.quote(value)}")
          PY
          source "$RUNNER_TEMP/runtime/env"
          curl -fsSL "$COPILOT_URL" -o "$RUNNER_TEMP/runtime/copilot.tgz"
          echo "$COPILOT_SHA  $RUNNER_TEMP/runtime/copilot.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/runtime/copilot.tgz" -C "$RUNNER_TEMP/runtime/copilot"
          curl -fsSL "$PROVIDER_URL" -o "$RUNNER_TEMP/runtime/provider.tgz"
          echo "$PROVIDER_SHA  $RUNNER_TEMP/runtime/provider.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/runtime/provider.tgz" -C "$RUNNER_TEMP/runtime/provider"
          curl -fsSL "$MODEL_URL" -o "$RUNNER_TEMP/runtime/$MODEL_FILE"
          echo "$MODEL_SHA  $RUNNER_TEMP/runtime/$MODEL_FILE" | sha256sum -c -
          test "$(stat -c %s "$RUNNER_TEMP/runtime/$MODEL_FILE")" = "$MODEL_SIZE"
          curl -fsSL "https://raw.githubusercontent.com/ggml-org/llama.cpp/c1d0e7a004015f23bc0233470b747b596f29b264/models/templates/Qwen-Qwen2.5-7B-Instruct.jinja" > "$RUNNER_TEMP/runtime/qwen-tool-template.jinja"
          test "$(git hash-object "$RUNNER_TEMP/runtime/qwen-tool-template.jinja")" = "bdf7919a96cfe43d50914a007b9c0877bd0ec27e"
          curl -fsSL "https://raw.githubusercontent.com/multica-ai/andrej-karpathy-skills/2c606141936f1eeef17fa3043a72095b4765b9c2/skills/karpathy-guidelines/SKILL.md" > "$RUNNER_TEMP/runtime/treatments/karpathy-guidelines/SKILL.md"
          curl -fsSL "https://raw.githubusercontent.com/DietrichGebert/ponytail/2ed6c52c9d7e5e56942508591085fd45dea277d3/skills/ponytail/SKILL.md" > "$RUNNER_TEMP/runtime/treatments/ponytail/SKILL.md"
          curl -fsSL "https://raw.githubusercontent.com/TheHalfMoon/Diffcipline/6bbeb59bab21724c92ed3456953a94e5202f0e53/skills/diffcipline/SKILL.md" > "$RUNNER_TEMP/runtime/treatments/diffcipline/SKILL.md"
          test "$(git hash-object "$RUNNER_TEMP/runtime/treatments/karpathy-guidelines/SKILL.md")" = "6a62d0441753157ca6ca50479e490c2948033adb"
          test "$(git hash-object "$RUNNER_TEMP/runtime/treatments/ponytail/SKILL.md")" = "02c0712c86277d49d18a77da3a2b825657bf02d1"
          test "$(git hash-object "$RUNNER_TEMP/runtime/treatments/diffcipline/SKILL.md")" = "0ca69dc046c7ba41d9b361b734a776ff536695ac"
          cp benchmarks/run-config.json "$RUNNER_TEMP/runtime/provenance.json"
      - name: Start pinned local model
        shell: bash
        run: |
          set -euo pipefail
          model_file="$(python -c 'import json; print(json.load(open("benchmarks/run-config.json"))["model"]["file"])')"
          server="$(find "$RUNNER_TEMP/runtime/provider" -type f -name llama-server -print -quit)"
          test -n "$server"
          chmod +x "$server"
          mapfile -t server_args < <(python -c 'import json; print("\n".join(json.load(open("benchmarks/run-config.json"))["provider"]["server_args"]))')
          "$server" --model "$RUNNER_TEMP/runtime/$model_file" "${server_args[@]}" \
            --chat-template-file "$RUNNER_TEMP/runtime/qwen-tool-template.jinja" \
            > "$RUNNER_TEMP/runtime/llama-server.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/runtime/llama-server.pid"
          ready=0
          for _ in $(seq 1 180); do
            if curl -fsS http://127.0.0.1:8080/health > "$RUNNER_TEMP/runtime/health.json"; then
              ready=1
              break
            fi
            sleep 1
          done
          if [[ "$ready" != 1 ]]; then
            cat "$RUNNER_TEMP/runtime/llama-server.log"
            exit 1
          fi
          curl -fsS http://127.0.0.1:8080/props > "$RUNNER_TEMP/runtime/props.json"
          grep -Fq "<tool_call>" "$RUNNER_TEMP/runtime/props.json"
      - name: Prove local model tool interface
        shell: bash
        run: |
          set -euo pipefail
          copilot="$(find "$RUNNER_TEMP/runtime/copilot" -type f -name copilot -print -quit)"
          chmod +x "$copilot"
          model="$(python -c 'import json; print(json.load(open("benchmarks/run-config.json"))["model"]["id"])')"
          provider_type="$(python -c 'import json; print(json.load(open("benchmarks/run-config.json"))["provider"]["type"])')"
          base_url="$(python -c 'import json; print(json.load(open("benchmarks/run-config.json"))["provider"]["base_url"])')"
          work="$RUNNER_TEMP/preflight-work"
          home="$RUNNER_TEMP/preflight-home"
          mkdir -p "$work" "$home"
          nonce="$(python -c 'import secrets; print(secrets.token_hex(16))')"
          printf '%s\n' "$nonce" > "$work/preflight-nonce.txt"
          (
            cd "$work"
            COPILOT_HOME="$home" \
            COPILOT_PROVIDER_TYPE="$provider_type" \
            COPILOT_PROVIDER_BASE_URL="$base_url" \
            COPILOT_PROVIDER_WIRE_API=completions \
            COPILOT_PROVIDER_MAX_PROMPT_TOKENS=28672 \
            COPILOT_PROVIDER_MAX_OUTPUT_TOKENS=4096 \
            COPILOT_MODEL="$model" \
            COPILOT_OFFLINE=true \
            timeout 480s "$copilot" -p "Use the bash tool to run: cat preflight-nonce.txt. Then reply with the exact file contents. Do not modify files." \
              --model "$model" --no-ask-user --disable-builtin-mcps \
              --available-tools='bash,list_bash,read_bash,stop_bash,write_bash,apply_patch,create,edit,view,glob,grep,skill' \
              --allow-tool=shell --deny-tool=write --deny-tool=url --deny-tool=memory \
              --share "$RUNNER_TEMP/runtime/model-preflight.md" \
              > "$RUNNER_TEMP/runtime/model-preflight.stdout" \
              2> "$RUNNER_TEMP/runtime/model-preflight.stderr"
          )
          test -s "$RUNNER_TEMP/runtime/model-preflight.md"
          grep -Fq "$nonce" "$RUNNER_TEMP/runtime/model-preflight.stdout" || \
            grep -Fq "$nonce" "$RUNNER_TEMP/runtime/model-preflight.md"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-local-preflight
          path: |
            ${{ runner.temp }}/runtime/provenance.json
            ${{ runner.temp }}/runtime/model-preflight.md
            ${{ runner.temp }}/runtime/model-preflight.stdout
            ${{ runner.temp }}/runtime/model-preflight.stderr
            ${{ runner.temp }}/runtime/llama-server.log
            ${{ runner.temp }}/runtime/health.json
            ${{ runner.temp }}/runtime/props.json
          if-no-files-found: warn
          retention-days: 30

  benchmark:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build pinned benchmark runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/runtime"/{copilot,provider,treatments/{karpathy-guidelines,ponytail,diffcipline}}
          python - <<'PY' > "$RUNNER_TEMP/runtime/env"
          import json, shlex
          c = json.load(open("benchmarks/run-config.json", encoding="utf-8"))
          for key, value in {
              "COPILOT_URL": c["copilot_cli"]["download_url"],
              "COPILOT_SHA": c["copilot_cli"]["linux_x64_sha256"],
              "PROVIDER_URL": c["provider"]["download_url"],
              "PROVIDER_SHA": c["provider"]["sha256"],
              "MODEL_URL": c["model"]["download_url"],
              "MODEL_SHA": c["model"]["sha256"],
              "MODEL_FILE": c["model"]["file"],
          }.items():
              print(f"{key}={shlex.quote(value)}")
          PY
          source "$RUNNER_TEMP/runtime/env"
          curl -fsSL "$COPILOT_URL" -o "$RUNNER_TEMP/runtime/copilot.tgz"
          echo "$COPILOT_SHA  $RUNNER_TEMP/runtime/copilot.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/runtime/copilot.tgz" -C "$RUNNER_TEMP/runtime/copilot"
          curl -fsSL "$PROVIDER_URL" -o "$RUNNER_TEMP/runtime/provider.tgz"
          echo "$PROVIDER_SHA  $RUNNER_TEMP/runtime/provider.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/runtime/provider.tgz" -C "$RUNNER_TEMP/runtime/provider"
          curl -fsSL "$MODEL_URL" -o "$RUNNER_TEMP/runtime/$MODEL_FILE"
          echo "$MODEL_SHA  $RUNNER_TEMP/runtime/$MODEL_FILE" | sha256sum -c -
          curl -fsSL "https://raw.githubusercontent.com/ggml-org/llama.cpp/c1d0e7a004015f23bc0233470b747b596f29b264/models/templates/Qwen-Qwen2.5-7B-Instruct.jinja" > "$RUNNER_TEMP/runtime/qwen-tool-template.jinja"
          test "$(git hash-object "$RUNNER_TEMP/runtime/qwen-tool-template.jinja")" = "bdf7919a96cfe43d50914a007b9c0877bd0ec27e"
          curl -fsSL "https://raw.githubusercontent.com/multica-ai/andrej-karpathy-skills/2c606141936f1eeef17fa3043a72095b4765b9c2/skills/karpathy-guidelines/SKILL.md" > "$RUNNER_TEMP/runtime/treatments/karpathy-guidelines/SKILL.md"
          curl -fsSL "https://raw.githubusercontent.com/DietrichGebert/ponytail/2ed6c52c9d7e5e56942508591085fd45dea277d3/skills/ponytail/SKILL.md" > "$RUNNER_TEMP/runtime/treatments/ponytail/SKILL.md"
          curl -fsSL "https://raw.githubusercontent.com/TheHalfMoon/Diffcipline/6bbeb59bab21724c92ed3456953a94e5202f0e53/skills/diffcipline/SKILL.md" > "$RUNNER_TEMP/runtime/treatments/diffcipline/SKILL.md"
          test "$(git hash-object "$RUNNER_TEMP/runtime/treatments/karpathy-guidelines/SKILL.md")" = "6a62d0441753157ca6ca50479e490c2948033adb"
          test "$(git hash-object "$RUNNER_TEMP/runtime/treatments/ponytail/SKILL.md")" = "02c0712c86277d49d18a77da3a2b825657bf02d1"
          test "$(git hash-object "$RUNNER_TEMP/runtime/treatments/diffcipline/SKILL.md")" = "0ca69dc046c7ba41d9b361b734a776ff536695ac"
          cp benchmarks/run-config.json "$RUNNER_TEMP/runtime/provenance.json"
          copilot="$(find "$RUNNER_TEMP/runtime/copilot" -type f -name copilot -print -quit)"
          server="$(find "$RUNNER_TEMP/runtime/provider" -type f -name llama-server -print -quit)"
          chmod +x "$copilot" "$server"
          printf '%s\n' "$copilot" > "$RUNNER_TEMP/runtime/copilot-path"
          mapfile -t server_args < <(python -c 'import json; print("\n".join(json.load(open("benchmarks/run-config.json"))["provider"]["server_args"]))')
          "$server" --model "$RUNNER_TEMP/runtime/$MODEL_FILE" "${server_args[@]}" \
            --chat-template-file "$RUNNER_TEMP/runtime/qwen-tool-template.jinja" \
            > "$RUNNER_TEMP/runtime/llama-server.log" 2>&1 &
          for _ in $(seq 1 180); do
            curl -fsS http://127.0.0.1:8080/health > /dev/null && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/runtime/llama-server.log"
          exit 1
      - name: Run T052 baseline and validate bundles
        shell: bash
        run: |
          set -euo pipefail
          model="$(python -c 'import json; print(json.load(open("benchmarks/run-config.json"))["model"]["id"])')"
          base_url="$(python -c 'import json; print(json.load(open("benchmarks/run-config.json"))["provider"]["base_url"])')"
          suffix="$(python -c 'import json; print(json.load(open("benchmarks/run-config.json"))["prompt_suffix"])')"
          results="$RUNNER_TEMP/benchmark/baseline/results"
          COPILOT_PROVIDER_TYPE=openai COPILOT_PROVIDER_BASE_URL="$base_url" COPILOT_MODEL="$model" COPILOT_OFFLINE=true \
            python benchmarks/harness/run_arm.py --arm baseline --model "$model" \
              --copilot "$(cat "$RUNNER_TEMP/runtime/copilot-path")" --results "$results" \
              --prompt-suffix "$suffix"
          cp "$RUNNER_TEMP/runtime/provenance.json" "$results/runtime-provenance.json"
          RESULTS="$results" ARM=baseline MODEL="$model" python - <<'PY'
          import json, os
          from pathlib import Path
          fixtures = ["f01-shared-root-cause","f02-stdlib-query","f03-dependency-temptation","f04-refactor-preserve","f05-security-boundary","f06-already-minimal"]
          root = Path(os.environ["RESULTS"])
          summary = json.load(open(root / "summary.json", encoding="utf-8"))
          assert summary["arm"] == os.environ["ARM"] and summary["model"] == os.environ["MODEL"] and summary["tasks"] == 6
          assert (root / "runtime-provenance.json").is_file()
          for task in fixtures:
              bundle = root / task
              for name in ["transcript.md","stdout.txt","stderr.txt","score.json","changes.patch","status.txt","metadata.json"]:
                  assert (bundle / name).is_file(), f"{task}: missing {name}"
              assert (bundle / "workspace").is_dir()
              metadata = json.load(open(bundle / "metadata.json", encoding="utf-8"))
              assert (metadata["arm"], metadata["task"], metadata["model"]) == (os.environ["ARM"], task, os.environ["MODEL"])
          PY
      - name: Run T053 comparison arms
        shell: bash
        run: |
          set -euo pipefail
          model="$(python -c 'import json; print(json.load(open("benchmarks/run-config.json"))["model"]["id"])')"
          base_url="$(python -c 'import json; print(json.load(open("benchmarks/run-config.json"))["provider"]["base_url"])')"
          suffix="$(python -c 'import json; print(json.load(open("benchmarks/run-config.json"))["prompt_suffix"])')"
          copilot="$(cat "$RUNNER_TEMP/runtime/copilot-path")"
          for arm in karpathy ponytail; do
            if [[ "$arm" == karpathy ]]; then
              skill="$RUNNER_TEMP/runtime/treatments/karpathy-guidelines/SKILL.md"
              skill_name=karpathy-guidelines
            else
              skill="$RUNNER_TEMP/runtime/treatments/ponytail/SKILL.md"
              skill_name=ponytail
            fi
            results="$RUNNER_TEMP/benchmark/$arm/results"
            COPILOT_PROVIDER_TYPE=openai COPILOT_PROVIDER_BASE_URL="$base_url" COPILOT_MODEL="$model" COPILOT_OFFLINE=true \
              python benchmarks/harness/run_arm.py --arm "$arm" --model "$model" \
                --copilot "$copilot" --results "$results" --skill "$skill" --skill-name "$skill_name" \
                --prompt-suffix "$suffix"
            cp "$RUNNER_TEMP/runtime/provenance.json" "$results/runtime-provenance.json"
          done
          for arm in karpathy ponytail; do
            ARM="$arm" MODEL="$model" RESULTS="$RUNNER_TEMP/benchmark/$arm/results" python - <<'PY'
          import json, os
          from pathlib import Path
          fixtures = ["f01-shared-root-cause","f02-stdlib-query","f03-dependency-temptation","f04-refactor-preserve","f05-security-boundary","f06-already-minimal"]
          root = Path(os.environ["RESULTS"])
          summary = json.load(open(root / "summary.json", encoding="utf-8"))
          assert summary["arm"] == os.environ["ARM"] and summary["model"] == os.environ["MODEL"] and summary["tasks"] == 6
          assert (root / "runtime-provenance.json").is_file()
          for task in fixtures:
              bundle = root / task
              for name in ["transcript.md","stdout.txt","stderr.txt","score.json","changes.patch","status.txt","metadata.json"]:
                  assert (bundle / name).is_file(), f"{task}: missing {name}"
              assert (bundle / "workspace").is_dir()
          PY
          done
      - name: Run T054 Diffcipline arm and validate bundles
        shell: bash
        run: |
          set -euo pipefail
          model="$(python -c 'import json; print(json.load(open("benchmarks/run-config.json"))["model"]["id"])')"
          base_url="$(python -c 'import json; print(json.load(open("benchmarks/run-config.json"))["provider"]["base_url"])')"
          suffix="$(python -c 'import json; print(json.load(open("benchmarks/run-config.json"))["prompt_suffix"])')"
          results="$RUNNER_TEMP/benchmark/diffcipline/results"
          COPILOT_PROVIDER_TYPE=openai COPILOT_PROVIDER_BASE_URL="$base_url" COPILOT_MODEL="$model" COPILOT_OFFLINE=true \
            python benchmarks/harness/run_arm.py --arm diffcipline --model "$model" \
              --copilot "$(cat "$RUNNER_TEMP/runtime/copilot-path")" --results "$results" \
              --skill "$RUNNER_TEMP/runtime/treatments/diffcipline/SKILL.md" --skill-name diffcipline \
              --prompt-suffix "$suffix"
          cp "$RUNNER_TEMP/runtime/provenance.json" "$results/runtime-provenance.json"
          RESULTS="$results" ARM=diffcipline MODEL="$model" python - <<'PY'
          import json, os
          from pathlib import Path
          fixtures = ["f01-shared-root-cause","f02-stdlib-query","f03-dependency-temptation","f04-refactor-preserve","f05-security-boundary","f06-already-minimal"]
          root = Path(os.environ["RESULTS"])
          summary = json.load(open(root / "summary.json", encoding="utf-8"))
          assert summary["arm"] == os.environ["ARM"] and summary["model"] == os.environ["MODEL"] and summary["tasks"] == 6
          assert (root / "runtime-provenance.json").is_file()
          for task in fixtures:
              bundle = root / task
              for name in ["transcript.md","stdout.txt","stderr.txt","score.json","changes.patch","status.txt","metadata.json"]:
                  assert (bundle / name).is_file(), f"{task}: missing {name}"
              assert (bundle / "workspace").is_dir()
          PY
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-results
          path: |
            ${{ runner.temp }}/benchmark
            ${{ runner.temp }}/runtime/provenance.json
            ${{ runner.temp }}/runtime/llama-server.log
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6
