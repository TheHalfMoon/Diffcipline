name: release

on:
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/diffcipline-cli/**"
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - ".github/workflows/release.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/diffcipline-cli/**"

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Build locked release binary
        run: cargo build --release --locked --package diffcipline
      - name: Package host-native binary
        id: package
        shell: bash
        run: |
          set -euo pipefail
          host="$(rustc -vV | awk '/^host:/ {print $2}')"
          mkdir -p dist
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            source="target/release/diffcipline.exe"
            artifact="diffcipline-${host}.exe"
          else
            source="target/release/diffcipline"
            artifact="diffcipline-${host}"
          fi
          "$source" --help >/dev/null
          cp "$source" "dist/$artifact"
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-${{ matrix.os }}
          path: dist/${{ steps.package.outputs.artifact }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  aggregate:
    name: checksums
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true
          digest-mismatch: error
      - name: Generate and verify SHA-256 manifest
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum diffcipline-* | LC_ALL=C sort -k2 > SHA256SUMS
          test "$(wc -l < SHA256SUMS)" -eq 3
          sha256sum -c SHA256SUMS
      - name: Confirm attestation verifier is available
        run: gh attestation verify --help >/dev/null
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate
          path: dist/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  attest:
    name: sign provenance
    if: github.event_name == 'push'
    needs: aggregate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate
          path: dist
          digest-mismatch: error
      - name: Create signed Sigstore provenance
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Preserve attestation bundle and verify subjects
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          cp "$BUNDLE_PATH" dist/PROVENANCE.sigstore.json
          for file in dist/diffcipline-*; do
            gh attestation verify "$file" --repo "$GITHUB_REPOSITORY"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-release-candidate
          path: dist/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  publish:
    name: publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: attest
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signed-release-candidate
          path: dist
          digest-mismatch: error
      - name: Verify tag matches crate version
        shell: bash
        run: |
          set -euo pipefail
          crate_version="$(awk -F '"' '/^version = / {print $2; exit}' crates/diffcipline-cli/Cargo.toml)"
          test "$GITHUB_REF_NAME" = "v${crate_version}"
          cd dist
          sha256sum -c SHA256SUMS
      - name: Publish immutable release inputs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Diffcipline $GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
