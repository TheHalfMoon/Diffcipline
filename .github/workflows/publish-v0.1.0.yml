name: publish-v0.1.0

on:
  pull_request:
    paths:
      - ".github/workflows/publish-v0.1.0.yml"
      - ".github/workflows/release.yml"
      - "crates/diffcipline-cli/Cargo.toml"
      - "docs/RELEASES.md"
      - "specs/**"
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  validate:
    name: validate immutable publish authority
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify exact candidate checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Validate publish request contract and tooling
        shell: bash
        run: |
          set -euo pipefail
          parse_request() {
            body="$1"
            read -r command tag target_sha extra <<< "$body"
            test "$command" = "/publish"
            test "$tag" = "v0.1.0"
            test -z "${extra:-}"
            [[ "$target_sha" =~ ^[0-9a-f]{40}$ ]]
          }
          parse_request "/publish v0.1.0 0123456789abcdef0123456789abcdef01234567"
          ! parse_request "/publish v0.1.0 deadbeef"
          ! parse_request "/publish v0.1.1 0123456789abcdef0123456789abcdef01234567"
          ! parse_request "/publish v0.1.0 0123456789abcdef0123456789abcdef01234567 extra"
          crate_version="$(awk -F '"' '/^version = / {print $2; exit}' crates/diffcipline-cli/Cargo.toml)"
          test "$crate_version" = "0.1.0"
          gh release edit --help >/dev/null
          gh release verify --help >/dev/null
          gh release verify-asset --help >/dev/null
          gh release download --help >/dev/null

  publish:
    name: publish and verify immutable v0.1.0
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      github.event.comment.user.login == github.repository_owner &&
      startsWith(github.event.comment.body, '/publish v0.1.0 ')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      pull-requests: read
    steps:
      - name: Parse explicit publication request
        id: request
        shell: bash
        env:
          REQUEST_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          read -r command tag target_sha extra <<< "$REQUEST_BODY"
          test "$command" = "/publish"
          test "$tag" = "v0.1.0"
          test -z "${extra:-}"
          [[ "$target_sha" =~ ^[0-9a-f]{40}$ ]]
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "target_sha=$target_sha" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.request.outputs.target_sha }}
          fetch-depth: 0

      - name: Verify canonical tag and crate version
        shell: bash
        env:
          TAG: ${{ steps.request.outputs.tag }}
          TARGET_SHA: ${{ steps.request.outputs.target_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git fetch origin main --no-tags
          test "$(git rev-parse origin/main)" = "$TARGET_SHA"
          git fetch origin "refs/tags/$TAG:refs/tags/$TAG" --no-tags
          test "$(git rev-parse "refs/tags/$TAG")" = "$TARGET_SHA"
          crate_version="$(awk -F '"' '/^version = / {print $2; exit}' crates/diffcipline-cli/Cargo.toml)"
          test "$crate_version" = "0.1.0"
          test "$TAG" = "v${crate_version}"

      - name: Verify staged draft release and provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.request.outputs.tag }}
        run: |
          set -euo pipefail
          test "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')" = "true"
          rm -rf staged
          mkdir staged
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir staged
          cd staged
          test -f SHA256SUMS
          test -f PROVENANCE.sigstore.json
          test "$(wc -l < SHA256SUMS)" -eq 3
          sha256sum -c SHA256SUMS
          for file in diffcipline-*; do
            gh attestation verify "$file" --repo "$GITHUB_REPOSITORY"
          done

      - name: Publish staged release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.request.outputs.tag }}
        run: |
          set -euo pipefail
          gh release edit "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            --verify-tag

      - name: Verify immutable release attestation and every asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.request.outputs.tag }}
        run: |
          set -euo pipefail
          immutable=false
          for attempt in $(seq 1 12); do
            if [[ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isImmutable --jq '.isImmutable')" == "true" ]] && \
               gh release verify "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null; then
              immutable=true
              break
            fi
            sleep 5
          done
          test "$immutable" = "true"
          gh release verify "$TAG" --repo "$GITHUB_REPOSITORY"
          for file in staged/*; do
            gh release verify-asset "$TAG" "$file" --repo "$GITHUB_REPOSITORY"
          done
